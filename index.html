<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо Штрафа</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E8423A;
    --red-dark: #B52E27;
    --gold: #F5C842;
    --dark: #1A1A2E;
    --darker: #0F0F1A;
    --card: #22223A;
  }

  body {
    min-height: 100vh;
    background: var(--darker);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Фоновые частицы */
  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,66,58,0.12) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Заголовок */
  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeDown 0.7s ease both;
  }
  .header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(24px, 5vw, 38px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header h1 span {
    color: var(--red);
  }
  .header p {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Обёртка колеса */
  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.7s 0.1s ease both;
  }

  .wheel-container {
    position: relative;
    width: min(340px, 90vw);
    height: min(340px, 90vw);
  }

  /* Стрелка-указатель */
  .pointer {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    filter: drop-shadow(0 4px 8px rgba(232,66,58,0.6));
  }
  .pointer svg {
    display: block;
  }

  canvas {
    display: block;
    border-radius: 50%;
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.06),
      0 0 0 10px rgba(232,66,58,0.15),
      0 20px 60px rgba(0,0,0,0.6);
  }

  /* Центральная кнопка */
  #spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    border: 4px solid rgba(255,255,255,0.15);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    z-index: 30;
    box-shadow:
      0 0 0 6px rgba(232,66,58,0.2),
      0 8px 24px rgba(232,66,58,0.5),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: center;
    line-height: 1.2;
  }
  #spin-btn:hover:not(:disabled) {
    transform: translate(-50%, -50%) scale(1.07);
    box-shadow:
      0 0 0 10px rgba(232,66,58,0.25),
      0 12px 32px rgba(232,66,58,0.6),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  #spin-btn:active:not(:disabled) {
    transform: translate(-50%, -50%) scale(0.95);
  }
  #spin-btn:disabled { cursor: not-allowed; opacity: 0.8; }
  #spin-btn .icon { font-size: 22px; line-height: 1; }
  #spin-btn .label { font-size: 10px; line-height: 1; }

  /* Результат */
  .result-box {
    margin-top: 28px;
    width: min(340px, 90vw);
    min-height: 72px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 20px;
    text-align: center;
    transition: all 0.4s ease;
    animation: fadeUp 0.7s 0.2s ease both;
  }
  .result-box.winner {
    border-color: rgba(232,66,58,0.4);
    box-shadow: 0 0 30px rgba(232,66,58,0.15);
  }
  #result-name {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  #result-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Редактор */
  .editor {
    margin-top: 16px;
    width: min(340px, 90vw);
    animation: fadeUp 0.7s 0.3s ease both;
  }
  details summary {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    user-select: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    padding: 6px;
    transition: color 0.2s;
  }
  details summary:hover { color: rgba(255,255,255,0.6); }
  details[open] summary { color: rgba(255,255,255,0.5); margin-bottom: 8px; }
  #names-input {
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 12px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  #names-input:focus { border-color: rgba(232,66,58,0.5); }
  #update-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(232,66,58,0.5);
    border-radius: 10px;
    color: var(--red);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  #update-btn:hover {
    background: var(--red);
    color: #fff;
  }

  /* Победный оверлей */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    animation: fadeIn 0.3s ease;
  }
  #overlay.show { display: flex; }
  .overlay-card {
    background: var(--card);
    border: 2px solid var(--red);
    border-radius: 24px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 0 60px rgba(232,66,58,0.4);
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .overlay-emoji { font-size: 56px; display: block; margin-bottom: 16px; }
  .overlay-label {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
  }
  .overlay-name {
    font-family: 'Oswald', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }
  .overlay-sub {
    font-size: 14px;
    color: var(--red);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 28px;
  }
  .overlay-close {
    padding: 12px 36px;
    background: var(--red);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(232,66,58,0.5);
  }
  .overlay-close:hover { transform: scale(1.05); }

  /* Конфетти */
  .confetti-piece {
    position: fixed;
    width: 8px; height: 14px;
    opacity: 0;
    pointer-events: none;
    z-index: 101;
    border-radius: 2px;
    animation: confettiFall 1.8s ease-in forwards;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="bg-dots"></div>
<div class="bg-glow"></div>

<!-- Победный оверлей -->
<div id="overlay">
  <div class="overlay-card">
    <span class="overlay-emoji">🎯</span>
    <div class="overlay-label">Сегодня штраф получает</div>
    <div class="overlay-name" id="overlay-name">—</div>
    <div class="overlay-sub">Поздравляем! 💸</div>
    <button class="overlay-close" onclick="closeOverlay()">Понятно!</button>
  </div>
</div>

<div class="header">
  <h1>Колесо <span>штрафа</span></h1>
  <p>Кто сегодня платит?</p>
</div>

<div class="wheel-section">
  <div class="wheel-container">
    <div class="pointer">
      <svg width="28" height="42" viewBox="0 0 28 42">
        <polygon points="14,42 0,0 28,0" fill="#E8423A"/>
        <polygon points="14,42 2,6 26,6" fill="#F5C842" opacity="0.4"/>
      </svg>
    </div>
    <canvas id="wheel" width="340" height="340"></canvas>
    <button id="spin-btn" onclick="spin()">
      <span class="icon">⚡</span>
      <span class="label">Кто же?</span>
    </button>
  </div>

  <div class="result-box" id="result-box">
    <div id="result-name" style="color:rgba(255,255,255,0.2);font-size:16px;font-weight:400;font-family:'Montserrat'">Нажми кнопку и узнай!</div>
    <div id="result-sub"></div>
  </div>

  <div class="editor">
    <details>
      <summary>✏️ Редактировать сотрудников</summary>
      <textarea id="names-input" placeholder="Каждый сотрудник с новой строки"></textarea>
      <button id="update-btn" onclick="updateNames()">Обновить список</button>
    </details>
  </div>
</div>

<script>
const PALETTE = [
  ['#E8423A','#fff'],
  ['#2E86DE','#fff'],
  ['#10AC84','#fff'],
  ['#F9CA24','#1A1A2E'],
  ['#8E44AD','#fff'],
  ['#E67E22','#fff'],
  ['#2ECC71','#1A1A2E'],
  ['#E91E63','#fff'],
  ['#00BCD4','#1A1A2E'],
  ['#FF5722','#fff'],
];

let employees = ['Евгений','Андрей','Кирилл','Анна','Вадим','Николай','Никита'];
let spinning = false;
let currentAngle = 0;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const SIZE = canvas.width;
const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 4;

// Точка под кончиком стрелки (сверху по центру)
const POINTER_X = CX;
const POINTER_Y = 18;

function drawWheel(angle) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const n = employees.length;
  const slice = (Math.PI * 2) / n;

  for (let i = 0; i < n; i++) {
    const start = angle + i * slice;
    const end = start + slice;
    const [bg, fg] = PALETTE[i % PALETTE.length];

    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(15,15,26,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = fg;
    const name = employees[i];
    const fSize = name.length > 8 ? 13 : 15;
    ctx.font = `700 ${fSize}px 'Oswald', sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 4;
    ctx.fillText(name, R - 12, fSize / 3);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, 50, 0, Math.PI * 2);
  ctx.fillStyle = '#1A1A2E';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function getWinner(angle) {
  // Используем isPointInPath — проверяем какой сектор содержит точку под стрелкой
  const n = employees.length;
  const slice = (Math.PI * 2) / n;
  for (let i = 0; i < n; i++) {
    const start = angle + i * slice;
    const end = start + slice;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    if (ctx.isPointInPath(POINTER_X, POINTER_Y)) {
      return employees[i];
    }
  }
  return employees[0];
}
function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

function spin() {
  if (spinning || employees.length < 2) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;

  const resultBox = document.getElementById('result-box');
  resultBox.classList.remove('winner');
  document.getElementById('result-name').style.cssText = 'color:rgba(255,255,255,0.35);font-size:15px;font-weight:400;font-family:Montserrat';
  document.getElementById('result-name').textContent = '🌀 Крутится...';
  document.getElementById('result-sub').textContent = '';

  const spins = 7 + Math.random() * 5;
  const targetDelta = spins * Math.PI * 2 + Math.random() * Math.PI * 2;
  const duration = 4500 + Math.random() * 1500;
  const startAngle = currentAngle;
  const startTime = performance.now();

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    currentAngle = startAngle + targetDelta * easeOut(t);
    drawWheel(currentAngle);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = startAngle + targetDelta;
      drawWheel(currentAngle);
      spinning = false;
      document.getElementById('spin-btn').disabled = false;

      const winner = getWinner(currentAngle);
      document.getElementById('result-name').style.cssText = '';
      document.getElementById('result-name').textContent = '🎯 ' + winner;
      document.getElementById('result-sub').textContent = 'Получает штраф сегодня!';
      resultBox.classList.add('winner');

      setTimeout(() => showOverlay(winner), 600);
    }
  }
  requestAnimationFrame(frame);
}

function showOverlay(name) {
  document.getElementById('overlay-name').textContent = name;
  document.getElementById('overlay').classList.add('show');
  launchConfetti();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

function launchConfetti() {
  const colors = ['#E8423A','#F5C842','#2E86DE','#10AC84','#E67E22','#8E44AD','#fff'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 1.2 + 's';
    el.style.animationDuration = (1.5 + Math.random() * 1) + 's';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

function updateNames() {
  const raw = document.getElementById('names-input').value;
  const list = raw.split('\n').map(s => s.trim()).filter(Boolean);
  if (list.length < 2) { alert('Добавь минимум 2 сотрудника!'); return; }
  employees = list;
  currentAngle = 0;
  drawWheel(currentAngle);
  const resultBox = document.getElementById('result-box');
  resultBox.classList.remove('winner');
  document.getElementById('result-name').style.cssText = 'color:rgba(255,255,255,0.2);font-size:16px;font-weight:400;font-family:Montserrat';
  document.getElementById('result-name').textContent = 'Нажми кнопку и узнай!';
  document.getElementById('result-sub').textContent = '';
}

document.getElementById('names-input').value = employees.join('\n');
drawWheel(currentAngle);
</script>
</body>
</html>
